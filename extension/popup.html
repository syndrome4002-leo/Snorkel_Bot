<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Snorkel Bot</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; margin: 10px 0 3px; font-weight: 600; font-size: 12px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 7px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 5px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        padding: 7px 10px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 5px;
        background: rgba(128, 128, 128, 0.12);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: rgba(128, 128, 128, 0.25); }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa0a6; }
      .dot.connected { background: #1e9e5a; }
      .dot.connecting { background: #d9a441; }
      .dot.disconnected { background: #c5382f; }
      pre {
        margin: 10px 0 0;
        padding: 8px;
        max-height: 150px;
        overflow: auto;
        background: rgba(128, 128, 128, 0.12);
        border-radius: 5px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Snorkel Bot</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="state">…</span></div>

    <label for="serverUrl">Server WebSocket URL</label>
    <input id="serverUrl" placeholder="ws://localhost:8787/extension" />

    <label for="token">Token (optional)</label>
    <input id="token" type="password" placeholder="matches BOT_TOKEN on the server" />

    <label for="projectKey">Project key</label>
    <input id="projectKey" placeholder="CDG_Sentinel_Ultra_00000" />

    <div class="row">
      <button id="save">Save &amp; reconnect</button>
      <button id="run">Start now</button>
    </div>

    <pre id="out">No run yet.</pre>
    <script src="popup.js"></script>
  </body>
</html>
